<div class="message" [attr.data-severity]="severity()" [attr.role]="severity() === 'error' ? 'alert' : 'status'" aria-atomic="true">
  <span class="message-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      @switch (severity()) {
        @case ('success') {
          <circle cx="12" cy="12" r="9" />
          <path d="m8 12 3 3 5-6" />
        }
        @case ('warning') {
          <path d="M12 3 2 21h20L12 3Z" />
          <path d="M12 9v5m0 3v1" />
        }
        @case ('error') {
          <circle cx="12" cy="12" r="9" />
          <path d="m8 8 8 8m0-8-8 8" />
        }
      }
    </svg>
  </span>
  <div class="message-content">
    <strong>{{ title() }}</strong>
    <p>{{ text() }}</p>
  </div>
  <button type="button" class="message-close" [attr.aria-label]="'Cerrar mensaje: ' + title()" (click)="dismissed.emit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="m6 6 12 12M18 6 6 18" />
    </svg>
  </button>
</div>
